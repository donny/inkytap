name: InkyTap
options:
  bundleIdPrefix: io.github.donny
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "27.2"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # Signing.xcconfig is gitignored; copy Signing.xcconfig.example to create it.
  disabledValidations: [missingConfigFiles]
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  InkyTap:
    type: application
    platform: iOS
    sources:
      - path: InkyTap
        excludes:
          - "Preview Content"
      - path: InkyTap/Preview Content
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.donny.inkytap
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"InkyTap/Preview Content\""
        ENABLE_PREVIEWS: YES
    entitlements:
      path: InkyTap/InkyTap.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats: [TAG]
    info:
      path: InkyTap/Info.plist
      properties:
        CFBundleDisplayName: InkyTap
        NFCReaderUsageDescription: InkyTap uses NFC to power and update your e-ink display.
        com.apple.developer.nfc.readersession.iso7816.select-identifiers: [D2760000850101]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
  InkyTapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InkyTapTests
    dependencies:
      - target: InkyTap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.donny.inkytap.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  InkyTap:
    build:
      targets:
        InkyTap: all
        InkyTapTests: [test]
    run:
      config: Debug
    test:
      targets:
        - InkyTapTests
    archive:
      config: Release
